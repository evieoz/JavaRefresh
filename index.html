
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JS Functions Demo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <header class="py-4 border-bottom bg-dark text-white">
        <div class="container">
            <h1 id="pageTitle" class="h4 m-0">🍂 JS Functions Demo</h1>
        </div>
    </header>

    <main class="container py-5">

        <!-- Original Buttons -->
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-lg-10">
                <div class="card shadow">
                    <div class="card-body">

                        <div class="row g-2 text-center">
                            <div class="col">
                                <button id="btnGreet" class="btn btn-secondary w-100">Greet</button>
                            </div>
                            <div class="col">
                                <button id="btnAvg" class="btn btn-secondary w-100">Average</button>
                            </div>
                            <div class="col">
                                <button id="btnTime" class="btn btn-secondary w-100">Time of Day</button>
                            </div>
                            <div class="col">
                                <button id="btnRandom" class="btn btn-secondary w-100">Random Number</button>
                            </div>
                            <div class="col">
                                <button id="btnClear" class="btn btn-secondary w-100">Clear</button>
                            </div>
                        </div>

                        <p class="text-secondary small text-center mt-3 mb-0">
                            Click a button to run the function.
                        </p>

                        <!-- Student Challenge Buttons -->
                        <div class="row g-2 text-center mt-3">
                            <div class="col">
                                <button id="btnChangeTitle" class="btn btn-primary w-100">
                                    Change Page Title
                                </button>
                            </div>

                            <div class="col">
                                <button id="btnCycleColor" class="btn btn-success w-100">
                                    Cycle Text Color
                                </button>
                            </div>

                            <div class="col">
                                <button id="btnBgColor" class="btn btn-warning w-100">
                                    Random Background
                                </button>
                            </div>

                            <div class="col">
                                <button id="btnAngry" class="btn btn-danger w-100">
                                    😡 Angry Mode
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Output Box -->
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="h6 text-uppercase text-secondary mb-3 text-center">
                            Output
                        </h2>

                        <div id="out" class="border rounded p-3" style="background-color: #f8f9fa;">
                            Output will appear here...
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
